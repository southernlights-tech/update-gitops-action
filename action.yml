name: 'Update GitOps repo'
description: 'Used for updating a gitops repo with new image(s)'
inputs:
  ssh-key:
    description: 'SSH key that has read/write access to the GitOps repo'
    required: false 
  gitops-repo:
    description: 'GitOps repo to update'
    required: true
  gitops-repo-branch:
    description: 'GitOps repo branch to update'
    required: true
    default: 'main'
  changes-by-file:
    description: 'JSON object with changes to make, by file as key'
    required: false 
  valueFile: 
    description: 'Path to the values files' 
    required: false
  value:
    description: 'Value for the property to change'
    required: false
  propertyPath: 
    description: 'Path inside the file to the property to patch'
    required: false
  commit-email:
    description: 'Email address to use for the commit'
    required: true
  commit-name:
    description: 'Name to use for the commit'
    required: true
  pr-title:
    description: 'Custom PR title. When provided, overrides the auto-generated title that would otherwise include the original commit message. Useful for preventing Linear issue IDs from leaking into gitops PR titles.'
    required: false
  token:
    required: false
    description: 'GitHub AuthToken for PR'

runs:
  using: "composite"
  steps:
  - name: Checkout GitOps Repository
    uses: actions/checkout@v4
    with:
      repository: ${{ inputs.gitops-repo }}
      token: ${{ inputs.token }}
      ref: ${{ inputs.gitops-repo-branch}}
      path: gitops
  - name: Generate PR title
    shell: bash
    id: pr-title
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.release.tag_name }}
      ACTOR_LOGIN: ${{ github.actor.login }}
      CUSTOM_TITLE: ${{ inputs.pr-title || '' }}
    run: |
      if [ -n "$CUSTOM_TITLE" ]; then
        echo "message=$CUSTOM_TITLE" >> "$GITHUB_OUTPUT"
        echo "title=$CUSTOM_TITLE" >> "$GITHUB_OUTPUT"
      else
        printf -v RAW_MESSAGE "Repo %s published %s by %s" "$REPO_NAME" "$COMMIT_MESSAGE" "$ACTOR_LOGIN"
        # Replace newlines with spaces to ensure valid GitHub Actions output format
        CLEAN_MESSAGE=$(echo "$RAW_MESSAGE" | tr '\n' ' ' | tr -s ' ')
        if [ ${#CLEAN_MESSAGE} -gt 256 ]; then
          TRIMMED_MESSAGE="${CLEAN_MESSAGE:0:253}..."
          echo "message=$TRIMMED_MESSAGE" >> "$GITHUB_OUTPUT"
        else
          echo "message=$CLEAN_MESSAGE" >> "$GITHUB_OUTPUT"
        fi
        echo "title=" >> "$GITHUB_OUTPUT"
      fi
  - uses: fjogeleit/yaml-update-action@v0.16.0
    with:
      branch: "gitops-${{ github.sha }}-${{ github.run_id }}"
      repository: ${{ inputs.gitops-repo }}
      commitChange: true 
      commitUserEmail: ${{ inputs.commit-email }}
      commitUserName: ${{ inputs.commit-name }}
      createPR: true 
      format: YAML
      message: ${{ steps.pr-title.outputs.message }}
      title: ${{ steps.pr-title.outputs.title }}
      workDir: gitops
      changes: ${{ inputs.changes-by-file }}
      valueFile: ${{ inputs.valueFile }}
      propertyPath: ${{ inputs.propertyPath }}
      value: ${{ inputs.value }}
      masterBranchName: main
      token: ${{ inputs.token }}
      targetBranch: ${{ inputs.gitops-repo-branch }}
      description: "This PR was created by GitOps automation."
